name: Validate Lakecraft

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install video evidence tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Test and verify release builds
        env:
          LAKECRAFT_TEST_TIMING_PROFILE: shared-runner
        run: node scripts/validate-workflow.mjs
